name: Build APK

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'android/**'
      - 'scripts/setup-android-sdk.sh'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/setup-android-sdk.sh'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the web UI
        run: |
          npm ci
          npm run build

      - name: Install the Android SDK
        run: bash scripts/setup-android-sdk.sh

      # A new signing key every run means every build is a different app: Android
      # rejects the update and users must uninstall, losing their data. The key
      # is a secret, so it is not committed; it is restored from repo secrets
      # when configured, and otherwise cached between runs to stay stable.
      - name: Restore the signing key
        uses: actions/cache@v4
        with:
          path: android/moviecreator.keystore
          key: moviecreator-keystore-v1

      - name: Build the APK
        env:
          MOVIECREATOR_KEYSTORE_B64: ${{ secrets.MOVIECREATOR_KEYSTORE_B64 }}
          MOVIECREATOR_KS_PASS: ${{ secrets.MOVIECREATOR_KS_PASS }}
        run: |
          export JAVA_HOME="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")}"
          export ANDROID_HOME="${ANDROID_HOME:-/opt/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash android/build.sh android/movie-creator.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: movie-creator-apk
          path: android/movie-creator.apk
          if-no-files-found: error
