# Fly.io deployment. `fly launch --no-deploy` then `fly secrets set APP_AUTH_TOKEN=...`
# then `fly deploy`. The shared-cpu-1x/512MB size is too small for ffmpeg renders;
# 1GB is the honest floor.
app = "movie-creator"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PREFERRED_RENDER_ENGINE = "hybrid"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/healthz"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "40s"
  method = "GET"
  path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
