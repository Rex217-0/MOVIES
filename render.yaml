services:
  - type: web
    name: movie-creator
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Valid plan values are free | 0.5c-512mb | 1c-2g | ... "starter" is not a
    # blueprint plan name and is rejected on deploy.
    # free = 0.1 CPU / 512 MB: renders work but slowly, and the service spins
    # down after 15 idle minutes (~1 min cold start). Use 1c-2g for real work.
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_AUTH_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PREFERRED_RENDER_ENGINE
        value: hybrid
      # Kung sa Server-2 tumatakbo ang ComfyUI, i-paste dito ang public URL ng
      # ComfyUI tunnel (hal. https://xxx.trycloudflare.com). Walang value dito:
      # i-set ito sa Render dashboard, at bagong URL ito sa bawat tunnel start.
      # Kung ito ay 127.0.0.1:8188 sa Render, wala itong mababang ComfyUI —
      # ang 127.0.0.1 sa Render ay ang Render container mismo, hindi ang PC mo.
      - key: COMFYUI_URL
        sync: false
      - key: COMFYUI_VIDEO_WORKFLOW
        value: /app/workflows/wan22_video_api.json
      # Ang Kaggle worker (T3) ay may bagong tunnel URL kada run. I-set ito sa
      # Render dashboard para awtomatikong mag-ulat ang notebook (cell 9) ng
      # bagong URL — walang redeploy. Kung walang value, 404 ang sync route at
      # manu-manong i-paste ang URL sa Setup dialog.
      - key: PILOT_SYNC_TOKEN
        sync: false
      - key: KAGGLE_PILOT_URL
        sync: false
