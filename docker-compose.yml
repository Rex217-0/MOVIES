services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Point this at any OpenAI-compatible server (vLLM, TGI, Ollama, OpenRouter...).
      DIREK_BACKEND: openai
      DIREK_API_BASE: http://model:8001/v1
      DIREK_MODEL_ID: Qwen/Qwen2.5-3B-Instruct
      DIREK_API_KEY: ${DIREK_API_KEY:-}
      DIREK_NETFLIX_CSV: /data/netflix_titles.csv
    volumes:
      - ./data:/data:ro
    depends_on:
      - model

  # A GPU model server. Comment this out when using a hosted API instead.
  model:
    image: vllm/vllm-openai:latest
    command: ["--model", "Qwen/Qwen2.5-3B-Instruct", "--port", "8001"]
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
